<style>
/* Layout: satu kolom kartu soal, papan rakaat sebagai inti visual; tombol jawaban besar untuk jari anak */
:root{
  --bg:#EAF3EF; --surface:#FFFFFF; --ink:#12352B; --muted:#4F6E64; --line:#CFE0D8;
  --accent:#E39A2D; --accent-ink:#3A2300; --ok:#23915F; --ok-soft:#D7F0E3; --miss:#D9574C; --miss-soft:#F9DEDA;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1F1A; --surface:#16302A; --ink:#E6F2EC; --muted:#9DBBB0; --line:#2A4A41;
  --accent:#F0B04C; --accent-ink:#2A1800; --ok:#4CC88E; --ok-soft:#1B4434; --miss:#F07C70; --miss-soft:#4A2522; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1F1A; --surface:#16302A; --ink:#E6F2EC; --muted:#9DBBB0; --line:#2A4A41;
  --accent:#F0B04C; --accent-ink:#2A1800; --ok:#4CC88E; --ok-soft:#1B4434; --miss:#F07C70; --miss-soft:#4A2522; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:2rem;font-weight:800}
h2{font-size:1.4rem}
p{margin:0}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.rule{border:2px dashed var(--accent);background:transparent}
.rule b{color:var(--ink)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:440px){.modes{grid-template-columns:1fr}}
#step{align-self:flex-start}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);padding:5px;border-radius:14px}
.segb{background:transparent;padding:10px 4px;font-size:1.05rem;color:var(--muted)}
.segb.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line),0 0 0 2px var(--accent)}
.rtable{display:flex;flex-direction:column;gap:8px}
.rrow{display:grid;grid-template-columns:1fr auto 3.2em;align-items:center;gap:12px;font-weight:700;font-variant-numeric:tabular-nums}
.rrow .muted{text-align:right}
.dots{display:flex;gap:6px}.dots i{width:16px;height:16px;border-radius:50%;display:block}
.d-ok{background:var(--ok)}.d-no{background:var(--miss)}
button{font-family:var(--display);font-weight:700;cursor:pointer;border:none;border-radius:14px;color:var(--ink)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mode{background:var(--surface);border:2px solid var(--line);padding:16px;text-align:left;display:flex;flex-direction:column;gap:4px;font-size:1.15rem}
.mode span{font-family:var(--body);font-weight:500;font-size:.92rem;color:var(--muted)}
.mode:hover{border-color:var(--accent)}
.primary{background:var(--accent);color:var(--accent-ink);padding:14px 20px;font-size:1.15rem}
.ghost{background:transparent;border:2px solid var(--line);padding:10px 16px;font-size:1rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pill{font-family:var(--display);font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-variant-numeric:tabular-nums}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.prayer{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.prayer h2{font-size:1.7rem}
.tag{font-weight:800;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.scene{display:flex;gap:14px;align-items:center}
.fig{flex:none;width:76px;height:76px;border-radius:16px;background:var(--bg);display:grid;place-items:center}
.fig svg{width:60px;height:60px}
.fig svg *{stroke:var(--ink);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;fill:none}
.scene-text{min-width:0;font-size:1.08rem}
.scene-text b{font-family:var(--display);font-size:1.25rem}
.q{font-family:var(--display);font-size:1.35rem;font-weight:800;text-align:center}
.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:10px}
.ans{background:var(--bg);border:2px solid var(--line);font-size:1.9rem;padding:10px 0;font-variant-numeric:tabular-nums}
.ans small{display:block;font-family:var(--body);font-size:.75rem;font-weight:700;color:var(--muted)}
.ans:hover:not(:disabled){border-color:var(--accent)}
.ans:disabled{cursor:default;opacity:.55}
.ans.right{background:var(--ok-soft);border-color:var(--ok);opacity:1}
.ans.wrong{background:var(--miss-soft);border-color:var(--miss);opacity:1}
.strip{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;flex-direction:column;align-items:center;gap:2px;width:74px;padding:6px 4px;border-radius:12px;background:var(--bg);border:2px solid transparent;font-size:.72rem;font-weight:700;text-align:center;line-height:1.2;position:relative;font-family:var(--body);color:var(--ink);cursor:pointer}
.chip.new{animation:pop .25s ease-out}
.chip:hover:not(:disabled){border-color:var(--line)}
.chip:disabled{cursor:default}
.chip.sel,.chip.sel:hover:not(:disabled){border-color:var(--accent);opacity:1}
.chip svg{width:40px;height:40px}
.chip svg *{stroke:var(--ink);stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round;fill:none}
.chip.later{opacity:.4}
.chip.hit{border-color:var(--ok);background:var(--ok-soft)}
.chip.hit.sel,.chip.hit.sel:hover:not(:disabled){border-color:var(--accent)}
.chip .n{position:absolute;top:-8px;right:-6px;background:var(--ok);color:var(--surface);border-radius:99px;width:22px;height:22px;display:grid;place-items:center;font-size:.8rem}
@keyframes pop{from{transform:scale(.7);opacity:.3}to{transform:scale(1);opacity:1}}
.verdict{font-family:var(--display);font-size:1.5rem;font-weight:800}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--miss)}
.board{display:flex;gap:8px}
.rk{flex:1;min-width:0;border-radius:12px;padding:10px 4px;text-align:center;font-family:var(--display);font-weight:700;border:2px solid}
.rk small{display:block;font-family:var(--body);font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.rk.got{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.rk.lost{background:var(--miss-soft);border-color:var(--miss);border-style:dashed;color:var(--ink)}
.legend{display:flex;gap:14px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.big{font-family:var(--display);font-size:3.4rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap}

.mosque{width:100%;height:auto;display:block;border-radius:14px;background:var(--bg)}
.mosque .f *{stroke:var(--ink);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;fill:none}
.mosque .f.mk *{stroke:var(--muted)}
.mosque .f.me *{stroke:var(--accent);stroke-width:3.8}
.mosque .arch{fill:var(--surface);stroke:var(--line);stroke-width:2}
.mosque .carpet{fill:var(--line)}
.mosque .lamp{stroke:var(--muted);stroke-width:1.5;fill:none}
.mosque .lampb{fill:var(--accent)}
.mosque text{font-family:var(--body);font-size:9px;font-weight:800;fill:var(--muted);text-anchor:middle}
.mosque text.me{fill:var(--accent)}
.narr{font-size:1.08rem}
.timer{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.timer .bar{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--miss)}
.plan{display:flex;flex-direction:column;gap:12px}
.prow{display:flex;flex-direction:column;gap:6px}
.prow .ph{display:flex;justify-content:space-between;gap:8px;font-family:var(--display);font-weight:700;font-size:1.1rem}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media (max-width:440px){.opts{grid-template-columns:1fr}}
.opt{background:var(--bg);border:2px solid var(--line);padding:9px 8px;font-family:var(--body);font-weight:800;font-size:.9rem;text-align:left}
.opt.sel{border-color:var(--accent);background:var(--surface)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--miss);background:var(--miss-soft)}
.opt:disabled{cursor:default}
.mark{font-size:.9rem;font-family:var(--body);font-weight:800}
.mark.ok{color:var(--ok)}.mark.no{color:var(--miss)}
.note{font-size:.88rem}
@media (prefers-reduced-motion:reduce){.chip.new{animation:none}.progress i{transition:none}}
</style>
</head><body>
<div class="wrap" id="app"></div>

<script>
const PRAYERS=[{name:'Subuh',n:2},{name:'Dzuhur',n:4},{name:'Ashar',n:4},{name:'Maghrib',n:3},{name:'Isya',n:4}];
const POS={
  qiyam:{label:'Berdiri membaca Al-Fatihah',short:'Berdiri',fig:'berdiri'},
  rukuk:{label:'Rukuk',short:'Rukuk',fig:'rukuk'},
  itidal:{label:"I'tidal (bangun dari rukuk)",short:"I'tidal",fig:'berdiri'},
  sujud1:{label:'Sujud pertama',short:'Sujud',fig:'sujud'},
  duduk:{label:'Duduk di antara dua sujud',short:'Duduk',fig:'duduk'},
  sujud2:{label:'Sujud kedua',short:'Sujud',fig:'sujud'},
  tasyahud_awal:{label:'Tasyahud awal',short:'Tasyahud awal',fig:'duduk'},
  tasyahud_akhir:{label:'Tasyahud akhir',short:'Tasyahud akhir',fig:'duduk'},
  salam:{label:'Salam',short:'Salam',fig:'salam'}
};
const FIG={
  berdiri:'<circle cx="30" cy="10" r="6"/><path d="M30 16V38M30 38L26 56M30 38L34 56M30 22L23 30M30 22L37 30"/>',
  rukuk:'<circle cx="10" cy="30" r="5"/><path d="M38 32L16 31M38 32L37 56M20 31L30 46"/>',
  sujud:'<circle cx="12" cy="51" r="4.5"/><path d="M42 40L17 49M42 40L38 56H54M24 46L20 56"/>',
  duduk:'<circle cx="38" cy="16" r="6"/><path d="M38 22V46M38 46L22 52M20 56H44M38 30L28 44"/>',
  salam:'<circle cx="34" cy="16" r="6"/><path d="M34 22V46M34 46L18 52M16 56H40M34 30L26 44"/><path d="M48 12L54 8M50 18H57M48 24L54 28"/>'
};
const svg=f=>`<svg viewBox="0 0 60 60" aria-hidden="true">${FIG[f]}</svg>`;
const TOTAL=10;
let S={screen:'home',mode:null,level:'mudah',i:0,score:0,q:null,answered:false,shown:1,round:[],res:[]};
try{S.level=localStorage.getItem('level')||'mudah'}catch(e){}
if(!LEVELS_OK())S.level='mudah';
function LEVELS_OK(){return ['mudah','sedang','sulit'].includes(S.level)}
const app=document.getElementById('app');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function getBest(m){try{return +localStorage.getItem('best_'+m)||0}catch(e){return 0}}
function setBest(m,v){try{localStorage.setItem('best_'+m,v)}catch(e){}}

function fullSeq(n){const s=[];for(let r=1;r<=n;r++){['qiyam','rukuk','itidal','sujud1','duduk','sujud2'].forEach(p=>s.push({r,p}));
  if(r===2&&n>=3)s.push({r,p:'tasyahud_awal'});if(r===n){s.push({r,p:'tasyahud_akhir'});s.push({r,p:'salam'});}}return s}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const LEVELS={
  mudah:{name:'Mudah',desc:'Datang saat imam berdiri atau sujud. Petunjuk lengkap.',hint:true},
  sedang:{name:'Sedang',desc:'Ditambah batas rukuk: datang saat rukuk atau i\'tidal.',hint:true},
  sulit:{name:'Sulit',desc:'Banyak jebakan tasyahud & i\'tidal. Tanpa petunjuk, imam bergerak sendiri, dan ada batas waktu menjawab.',hint:false}
};
const EASY=['qiyam','sujud1','sujud2','duduk'],TRICKY=['rukuk','itidal','tasyahud_awal','tasyahud_akhir'];
function buildQ(pr,idx){const seq=fullSeq(pr.n),got=seq.slice(idx).filter(x=>x.p==='rukuk').length;
  const steps=seq.slice(idx);return {pr,seq,idx,at:seq[idx],got,kurang:pr.n-got,steps,stopAt:stopPoint(seq,steps)}}
// Gerakan yang terlihat oleh makmum: sujud 1/2 sama, tasyahud awal/akhir sama
const OBS=p=>p.startsWith('sujud')?'sujud':p.startsWith('tasyahud')?'tasyahud':p;
// Titik paling awal di mana jawaban sudah pasti dari gerakan yang terlihat
function stopPoint(seq,steps){
  const n=seq[seq.length-1].r,L=seq.map(x=>OBS(x.p));
  const kur=j=>n-seq.slice(j).filter(x=>x.p==='rukuk').length;
  let cands=seq.map((x,j)=>j).filter(j=>seq[j].p!=='salam');
  for(let i=0;i<steps.length;i++){
    cands=cands.filter(j=>j+i<L.length&&L[j+i]===OBS(steps[i].p));
    if(new Set(cands.map(kur)).size===1)return i;
  }
  return steps.length-1;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick2(pool,alt){const a=shuffle(pool.slice());return a.length>=2?a.slice(0,2):[a[0],shuffle(alt.filter(x=>x!==a[0]))[0]]}
function makeRound(level){
  const qs=[];
  PRAYERS.forEach(pr=>{
    const seq=fullSeq(pr.n),all=seq.map((x,i)=>i).filter(i=>seq[i].p!=='salam');
    const easy=all.filter(i=>EASY.includes(seq[i].p)),edge=all.filter(i=>['rukuk','itidal'].includes(seq[i].p)),
          tricky=all.filter(i=>TRICKY.includes(seq[i].p)),tsy=all.filter(i=>seq[i].p.startsWith('tasyahud'));
    let ids;
    if(level==='mudah')ids=pick2(easy,easy);
    else if(level==='sedang')ids=[rnd(easy),rnd(edge)];
    else{const t=rnd(tsy);ids=[t,rnd(tricky.filter(i=>i!==t))];}
    ids.forEach(i=>qs.push(buildQ(pr,i)));
  });
  // acak urutan, hindari waktu sholat sama berurutan
  for(let k=0;k<50;k++){shuffle(qs);if(qs.every((q,i)=>!i||q.pr.name!==qs[i-1].pr.name))break}
  return qs;
}
function reason(q){
  const {at,pr}=q,k=at.r;
  if(at.p==='qiyam'&&k===1)return 'Kamu ikut dari awal sholat, jadi semua rakaat terhitung.';
  if(at.p==='qiyam'||at.p==='rukuk')return `Kamu masih sempat rukuk bersama imam di rakaat ke-${k}, jadi rakaat ke-${k} ikut terhitung.`;
  if(at.p==='tasyahud_awal')return 'Tasyahud awal artinya rakaat ke-2 sudah selesai. Rakaat 1 dan 2 tidak terhitung.';
  if(at.p==='tasyahud_akhir')return `Tasyahud akhir artinya imam sudah selesai semua rakaat. Tidak ada rakaat yang terhitung, jadi kamu sholat ${pr.n} rakaat setelah imam salam.`;
  return `Imam sudah bangun dari rukuk di rakaat ke-${k}, jadi rakaat ke-${k} tidak terhitung.`;
}

// Pemandangan dari samping: mihrab di kiri, imam di depan, shaf makmum di belakang, "Kamu" paling belakang
function mosque(imam,me,others){
  others=others||imam;
  const fig=(f,x,cls)=>`<g class="f ${cls}" transform="translate(${x} 26)">${FIG[f]}</g>`;
  return `<svg class="mosque" viewBox="0 0 320 104" role="img" aria-label="Imam sedang ${imam}, kamu sedang ${me}">
    <path class="arch" d="M6 88V38Q6 10 30 4Q54 10 54 38V88Z"/>
    <path class="lamp" d="M100 0V10"/><circle class="lampb" cx="100" cy="13" r="3.5"/>
    <path class="lamp" d="M220 0V10"/><circle class="lampb" cx="220" cy="13" r="3.5"/>
    <rect class="carpet" x="0" y="86" width="320" height="5" rx="2"/>
    ${fig(imam,60,'')}${fig(others,150,'mk')}${fig(others,200,'mk')}${fig(me,252,'me')}
    <text x="90" y="101">Imam</text><text x="205" y="101">Makmum</text><text class="me" x="282" y="101">Kamu</text>
  </svg>`;
}
const TLIMIT=12000,AUTO=1500;
function clearT(){clearTimeout(S.t1);clearInterval(S.t2)}
const PLAN={berdiri:'Langsung berdiri lagi',awal:'Duduk tasyahud awal, lalu berdiri',akhir:'Tasyahud akhir, lalu salam'};
function planKey(q,t){const own=q.got+t,n=q.pr.n;return own===n?'akhir':(own===2&&n>=3?'awal':'berdiri')}
function render(){
  clearT();
  if(S.screen==='home')return home();
  if(S.screen==='end')return end();
  play();
}
function home(){
  app.innerHTML=`
  <header style="display:flex;flex-direction:column;gap:6px">
    <span class="tag">Latihan Masbuk</span>
    <h1>Kurang Berapa Rakaatku?</h1>
    <p class="muted">Datang telat ke sholat berjamaah? Hitung berapa rakaat yang harus kamu tambah setelah imam salam.</p>
  </header>
  <div class="card rule">
    ${mosque('rukuk','rukuk')}
    <p><b>Patokannya:</b> kalau kamu masih sempat <b>rukuk bersama imam</b>, rakaat itu terhitung.</p>
    <p><b>Caranya di masjid:</b> nggak ada yang kasih tahu imam di rakaat berapa. Jadi <b>hitung berapa kali kamu rukuk bareng imam</b> sampai imam salam. Kurangnya = jumlah rakaat sholat dikurangi hitunganmu.</p>
  </div>
  <div class="card" style="gap:10px">
    <span class="tag">Tingkat kesulitan</span>
    <div class="seg" role="radiogroup" aria-label="Tingkat kesulitan">${Object.entries(LEVELS).map(([k,v])=>`<button role="radio" aria-checked="${S.level===k}" class="segb${S.level===k?' on':''}" data-l="${k}">${v.name}</button>`).join('')}</div>
    <p class="muted">${LEVELS[S.level].desc} Tiap ronde 10 soal: 2 soal untuk masing-masing Subuh, Dzuhur, Ashar, Maghrib, dan Isya.</p>
  </div>
  <div class="modes">
    <button class="mode" id="m2">Seperti di Masjid<span>Kamu cuma lihat imam sedang apa. Ikuti gerakan imam satu per satu sampai salam, lalu hitung sendiri.</span><span>Rekor: ${getBest('ikuti_'+S.level)}/${TOTAL}</span></button>
    <button class="mode" id="m1">Tebak Cepat<span>Pemanasan. Imam di rakaat ke berapa sudah diberi tahu, langsung hitung.</span><span>Rekor: ${getBest('cepat_'+S.level)}/${TOTAL}</span></button>
  </div>`;
  document.getElementById('m1').onclick=()=>start('cepat');
  document.getElementById('m2').onclick=()=>start('ikuti');
  app.querySelectorAll('.segb').forEach(b=>b.onclick=()=>{S.level=b.dataset.l;try{localStorage.setItem('level',S.level)}catch(e){}render()});
}
function start(m){S={...S,screen:'play',mode:m,i:0,score:0,res:[],aOk:0,aTot:0,round:makeRound(S.level)};next()}
function next(){
  if(S.i>=TOTAL){S.screen='end';return render()}
  S.q=S.round[S.i];S.answered=false;S.picked=null;S.shown=1;S.view=null;S.popped=0;S.phase='count';S.deadline=0;S.plan=null;S.planChecked=false;
  render();window.scrollTo({top:0});
}
const SEEN={qiyam:'berdiri membaca surat',rukuk:'rukuk',itidal:'berdiri bangun dari rukuk',sujud1:'sujud',sujud2:'sujud',duduk:'duduk di antara dua sujud',tasyahud_awal:'duduk tasyahud',tasyahud_akhir:'duduk tasyahud'};
const isTsy=p=>p==='tasyahud_awal'||p==='tasyahud_akhir';
function narr(st,i,final){
  const c=st[i],pv=st[i-1];
  if(!LEVELS[S.level].hint&&i>0)return `Imam <b>${({qiyam:'berdiri',rukuk:'rukuk',itidal:'bangun dari rukuk',sujud1:'sujud',sujud2:'sujud',duduk:'duduk di antara dua sujud',tasyahud_awal:'duduk tasyahud',tasyahud_akhir:'duduk tasyahud',salam:'salam'})[c.p]}</b>.`;
  if(i===0)return c.p==='rukuk'
    ?'Kamu datang, imam sedang <b>rukuk</b>. Kamu cepat takbir lalu ikut rukuk, sempat tenang (tuma\'ninah) bersama imam.'
    :`Kamu datang, imam sedang <b>${SEEN[c.p]}</b>. Kamu takbir lalu ikut imam.`;
  if(c.p==='rukuk')return 'Imam <b>rukuk</b>. Kamu ikut rukuk.';
  if(c.p==='qiyam'&&pv&&pv.p==='tasyahud_awal')return 'Imam <b>bangkit dari duduk</b> lalu berdiri. Berarti tadi itu tasyahud awal. Masih ada rakaat lagi.';
  if(c.p==='qiyam')return 'Imam bangun dari sujud lalu <b>berdiri</b>. Berarti masih ada rakaat lagi.';
  if(c.p==='itidal')return 'Imam bangun dari rukuk (i\'tidal).';
  if(c.p==='sujud1'||c.p==='sujud2')return 'Imam <b>sujud</b>.';
  if(c.p==='duduk')return 'Imam duduk di antara dua sujud.';
  if(isTsy(c.p))return final
    ?`Imam <b>duduk tasyahud</b>. ${S.q.pr.n===2?'Subuh cuma punya satu tasyahud, jadi ini pasti':'Ini pasti'} ${c.p==='tasyahud_akhir'?'tasyahud akhir':'tasyahud awal'}.`
    :'Imam <b>duduk tasyahud</b>. Tasyahud awal atau akhir? Belum tahu, ikuti terus.';
  if(c.p==='salam')return 'Imam <b>salam</b>. Berarti tadi itu tasyahud akhir, sholat imam selesai. Kamu jangan ikut salam!';
}
function explainStop(q){
  const st=q.steps,i=q.stopAt,c=st.slice(0,i+1).filter(x=>x.p==='rukuk').length,rest=q.got-c,cur=st[i];
  if(cur.p==='salam')return `Imam sudah salam. Kamu rukuk bareng imam <b>${c} kali</b>, jadi dapat ${q.got} rakaat.`;
  const why=cur.p==='qiyam'&&i>0&&st[i-1].p==='tasyahud_awal'?'Imam bangkit dari tasyahud awal, berarti sekarang masuk rakaat ke-3.'
    :cur.p==='qiyam'&&i>0&&st[i-1].p==='sujud2'?`Setelah sujud imam langsung berdiri, tidak duduk tasyahud. Di sholat ${q.pr.name} itu cuma terjadi setelah rakaat ke-1, jadi sekarang imam masuk rakaat ke-2.`
    :cur.p==='tasyahud_akhir'&&q.pr.n===2?'Subuh cuma punya satu tasyahud, jadi ini pasti tasyahud akhir.'
    :`Dari gerakan tadi sudah ketahuan imam ada di rakaat ke-${cur.r}.`;
  return `${why} Sampai titik ini kamu sudah rukuk bareng imam <b>${c} kali</b>${rest>0?`, dan nanti masih ikut <b>${rest} rakaat</b> lagi sampai imam salam`:''}. Jadi dapat ${q.got} rakaat.`;
}
function chipLabel(p,reveal){return (!reveal&&isTsy(p))?'Tasyahud':POS[p].short}
function answer(v){
  const q=S.q;S.picked=v;S.answered=true;const ok=v===q.kurang;if(ok)S.score++;
  S.res.push({name:q.pr.name,ok});render();
  const f=document.getElementById('fb');if(f)f.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});
}
function header(){
  return `<div class="top"><button class="ghost" id="home">← Menu</button>
    <span class="pill">${LEVELS[S.level].name}</span><span class="pill">Soal ${S.i+1}/${TOTAL}</span><span class="pill">Skor ${S.score}</span></div>
  <div class="progress"><i style="width:${(S.i/TOTAL)*100}%"></i></div>`;
}
function play(){
  if(S.phase==='after')return after();
  const q=S.q,n=q.pr.n,ik=S.mode==='ikuti',sulit=S.level==='sulit';
  const done=!ik||S.shown>q.stopAt;
  let body='';
  if(ik){
    const shownSteps=S.answered?q.steps:q.steps.slice(0,S.shown);
    // S.view: gerakan yang diketuk ulang di strip; null = gerakan terkini
    const vi=S.view!=null&&S.view<shownSteps.length?S.view:S.shown-1,live=vi===S.shown-1;
    const cur=q.steps[vi];let c=0;
    const canTap=!(sulit&&!done),pop=S.popped!==S.shown&&!S.answered;S.popped=S.shown;
    const enough=live&&done&&LEVELS[S.level].hint&&cur.p!=='salam'?'<br><b>Petunjuknya sudah cukup!</b> Gerakan dihentikan, sekarang hitung.':'';
    const f=POS[cur.p].fig;
    body=`${mosque(f,cur.p==='salam'?'berdiri':f,f)}
    <p class="narr">${live?'':`<span class="tag">Gerakan ke-${vi+1}</span><br>`}${narr(q.steps,vi,live?done:S.answered)}${enough}</p>
    <div class="strip" aria-label="Gerakan imam">${shownSteps.map((s,i)=>{
      const hit=S.answered&&s.p==='rukuk';if(hit)c++;const later=i>=S.shown;
      return `<button class="chip${hit?' hit':''}${later?' later':''}${i===vi&&(!live||S.view!=null)?' sel':''}${pop&&i===S.shown-1?' new':''}" data-i="${i}" ${canTap?'':'disabled'} aria-pressed="${i===vi}" aria-label="Gerakan ke-${i+1}: ${chipLabel(s.p,S.answered)}">${hit?`<span class="n">${c}</span>`:''}${svg(POS[s.p].fig)}${chipLabel(s.p,S.answered)}</button>`}).join('')}</div>
    ${canTap&&shownSteps.length>1?`<p class="muted note">${live?'Ketuk gerakan di atas untuk lihat lagi penjelasannya.':'<button class="ghost" id="nowv" style="padding:6px 12px;font-size:.9rem">Kembali ke gerakan terkini</button>'}</p>`:''}
    ${S.answered&&S.shown<q.steps.length?'<p class="muted note">Gerakan yang samar adalah sisa sholat setelah dihentikan.</p>':''}
    ${done?'':(sulit?'<p class="muted">Imam tidak menunggu. Perhatikan terus...</p>':'<button class="primary" id="step">Ikut imam ▶</button>')}`;
  }else{
    const f=POS[q.at.p].fig;
    body=`${mosque(f,f)}<p class="narr">Imam di <b>rakaat ke-${q.at.r}</b>, sedang <b>${POS[q.at.p].label}</b>. Kamu takbir lalu ikut imam.</p>`;
  }
  const canAns=done&&!S.answered;
  if(canAns&&sulit&&!S.deadline)S.deadline=Date.now()+TLIMIT;
  const answers=Array.from({length:n+1},(_,v)=>{
    let cls='ans';if(S.answered){if(v===q.kurang)cls+=' right';else if(v===S.picked)cls+=' wrong'}
    return `<button class="${cls}" data-v="${v}" ${canAns?'':'disabled'}>${v}<small>rakaat</small></button>`}).join('');
  let fb='';
  if(S.answered){
    const ok=S.picked===q.kurang,firstGot=n-q.got+1;
    const board=Array.from({length:n},(_,i)=>{const r=i+1,g=r>=firstGot;
      return `<div class="rk ${g?'got':'lost'}">R${r}<small>${g?'bareng imam':'tambah'}</small></div>`}).join('');
    fb=`<div class="card" id="fb">
      <div class="verdict ${ok?'ok':'no'}">${ok?'Betul!':S.picked===-1?`Waktu habis, jawabannya ${q.kurang}`:`Belum tepat, jawabannya ${q.kurang}`}</div>
      ${ik?`<p>${explainStop(q)} ${q.pr.name} ${n} rakaat, kurang ${n} − ${q.got} = <b>${q.kurang}</b>.</p>
      <p class="muted">Ternyata waktu kamu datang, imam di rakaat ke-${q.at.r}${isTsy(q.at.p)?` (${POS[q.at.p].label.toLowerCase()})`:''}. ${reason(q)}</p>`:`<p>${reason(q)}</p>`}
      <div class="board">${board}</div>
      <div class="legend"><span><i style="background:var(--ok)"></i>Dapat bersama imam (${q.got})</span><span><i style="background:var(--miss)"></i>Ditambah sendiri (${q.kurang})</span></div>
      ${q.kurang===0?`<p>Tidak perlu menambah. Salam bersama imam.</p><button class="primary" id="nx">${S.i+1>=TOTAL?'Lihat hasil':'Soal berikutnya'}</button>`
        :`<p>Setelah imam salam, berdiri lagi dan tambah <b>${q.kurang} rakaat</b>. Bagaimana urutannya?</p><button class="primary" id="toAfter">Setelah imam salam ▶</button>`}
    </div>`;
  }
  const timer=canAns&&sulit?`<div class="timer" aria-live="off"><span id="tsec">${Math.ceil((S.deadline-Date.now())/1000)}</span><div class="bar"><i id="tbar" style="width:${Math.max(0,(S.deadline-Date.now())/TLIMIT*100)}%"></i></div><span class="muted" style="font-family:var(--body);font-size:.85rem">sebelum imam salam</span></div>`:'';
  const qtxt=ik&&q.steps[q.stopAt].p==='salam'?'Imam sudah salam. ':'';
  app.innerHTML=`${header()}
  <div class="card">
    <div class="prayer"><h2>Sholat ${q.pr.name}</h2><span class="tag">${n} rakaat</span></div>
    ${body}
  </div>
  ${done?`<div class="card" id="qa"><p class="q">${qtxt}Kurang berapa rakaatku?</p>${timer}<div class="answers">${answers}</div></div>`:''}
  ${fb}`;
  document.getElementById('home').onclick=()=>{S.screen='home';render()};
  const st=document.getElementById('step');
  if(st){st.onclick=()=>{S.shown++;S.view=null;render();const b=document.getElementById('step')||document.getElementById('qa');b&&b.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});(document.getElementById('step')||b).focus?.({preventScroll:true})}}
  if(ik&&sulit&&!done){S.t1=setTimeout(()=>{S.shown++;S.view=null;render();const b=document.getElementById('qa');if(b)b.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'})},AUTO)}
  if(canAns&&sulit){S.t2=setInterval(()=>{const left=S.deadline-Date.now();
    if(left<=0){clearT();return answer(-1)}
    const t=document.getElementById('tsec'),b=document.getElementById('tbar');if(t)t.textContent=Math.ceil(left/1000);if(b)b.style.width=(left/TLIMIT*100)+'%'},100)}
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;S.view=S.view===i||(i===S.shown-1&&!S.answered)?null:i;render()});
  const nv=document.getElementById('nowv');if(nv)nv.onclick=()=>{S.view=null;render()};
  app.querySelectorAll('.ans').forEach(b=>b.onclick=()=>{if(!canAns)return;clearT();answer(+b.dataset.v)});
  const nx=document.getElementById('nx');if(nx)nx.onclick=()=>{S.i++;next()};
  const ta=document.getElementById('toAfter');if(ta)ta.onclick=()=>{S.phase='after';S.plan=Array(q.kurang).fill(null);S.planChecked=false;render();window.scrollTo({top:0})};
}
function after(){
  const q=S.q,n=q.pr.n,chk=S.planChecked;
  const rows=S.plan.map((v,i)=>{const t=i+1,key=planKey(q,t),own=q.got+t;
    return `<div class="prow"><div class="ph"><span>Tambahan ${t}${chk?` <span class="muted" style="font-family:var(--body);font-size:.9rem">= rakaat ke-${own} sholatmu</span>`:''}</span>
      ${chk?`<span class="mark ${v===key?'ok':'no'}">${v===key?'Betul':'Salah'}</span>`:''}</div>
      <p class="muted note">Selesai sujud kedua, lalu...</p>
      <div class="opts">${Object.entries(PLAN).map(([k,l])=>{let c='opt';
        if(chk){if(k===key)c+=' right';else if(k===v)c+=' wrong'}else if(k===v)c+=' sel';
        return `<button class="${c}" data-r="${i}" data-k="${k}" ${chk?'disabled':''} aria-pressed="${k===v}">${l}</button>`}).join('')}</div></div>`}).join('');
  const full=S.plan.every(Boolean);
  let fb='';
  if(chk){
    const allOk=S.plan.every((v,i)=>v===planKey(q,i+1));
    const hasAwal=S.plan.some((v,i)=>planKey(q,i+1)==='awal');
    fb=`<div class="card" id="fb2">
      <div class="verdict ${allOk?'ok':'no'}">${allOk?'Urutannya betul!':'Masih ada yang keliru'}</div>
      <p>${q.got>0?`Rakaat yang kamu dapat bersama imam dihitung sebagai <b>awal sholatmu</b> (rakaat ke-1${q.got>1?`–${q.got}`:''}). Jadi rakaat tambahan pertama adalah rakaat ke-${q.got+1}.`:'Kamu tidak dapat rakaat bersama imam, jadi sholatmu dimulai dari rakaat ke-1 seperti biasa.'}</p>
      ${hasAwal?'<p>Tasyahud awal ada setelah <b>rakaat ke-2 sholatmu</b>, bukan setelah rakaat ke-2 imam.</p>':(n>=3?'<p>Tasyahud awal (setelah rakaat ke-2 sholatmu) sudah lewat waktu kamu bersama imam, jadi di tambahan tidak ada lagi.</p>':'')}
      <p class="muted note">Mengikuti pendapat madzhab Syafi'i.</p>
      <button class="primary" id="nx">${S.i+1>=TOTAL?'Lihat hasil':'Soal berikutnya'}</button>
    </div>`;
  }
  app.innerHTML=`${header()}
  <div class="card">
    <div class="prayer"><h2>Sholat ${q.pr.name}</h2><span class="tag">${n} rakaat · dapat ${q.got}</span></div>
    ${mosque('salam','berdiri')}
    <p class="narr">Imam salam. Kamu tidak ikut salam, tapi <b>berdiri lagi</b> dan tambah <b>${q.kurang} rakaat</b>. Setelah sujud kedua di tiap rakaat tambahan, kamu ngapain?</p>
  </div>
  <div class="card"><div class="plan">${rows}</div>${chk?'':`<button class="primary" id="cek" ${full?'':'disabled style="opacity:.5;cursor:default"'}>Cek urutan</button>`}</div>
  ${fb}`;
  document.getElementById('home').onclick=()=>{S.screen='home';render()};
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(chk)return;S.plan[+b.dataset.r]=b.dataset.k;render()});
  const ck=document.getElementById('cek');if(ck&&full)ck.onclick=()=>{S.planChecked=true;S.aTot++;if(S.plan.every((v,i)=>v===planKey(q,i+1)))S.aOk++;render();
    const f=document.getElementById('fb2');if(f)f.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'})};
  const nx=document.getElementById('nx');if(nx)nx.onclick=()=>{S.i++;next()};
}
function end(){
  const key=S.mode+'_'+S.level,best=Math.max(getBest(key),S.score);setBest(key,best);
  const msg=S.score===TOTAL?(S.level==='sulit'?'Sempurna di level Sulit! Kamu siap jadi masbuk yang teliti.':'Sempurna! Coba naik ke level berikutnya.'):S.score>=8?'Bagus! Sedikit lagi sempurna.':'Ayo latihan lagi. Ingat: hitung rukuk bareng imam.';
  const rows=PRAYERS.map(pr=>{const r=S.res.filter(x=>x.name===pr.name);
    return `<div class="rrow"><span>${pr.name}</span><span class="dots">${r.map(x=>`<i class="${x.ok?'d-ok':'d-no'}" title="${x.ok?'benar':'salah'}"></i>`).join('')}</span><span class="muted">${r.filter(x=>x.ok).length}/${r.length}</span></div>`}).join('');
  const nextLv=S.score>=8&&S.level!=='sulit'?(S.level==='mudah'?'sedang':'sulit'):null;
  app.innerHTML=`<div class="card" style="text-align:center;align-items:center">
    <span class="tag">${S.mode==='cepat'?'Tebak Cepat':'Seperti di Masjid'} · ${LEVELS[S.level].name}</span>
    <div class="big">${S.score}/${TOTAL}</div>
    <p>${msg}</p><p class="muted">Rekor level ini: ${best}/${TOTAL}</p>
  </div>
  <div class="card"><span class="tag">Hasil per waktu sholat</span><div class="rtable">${rows}</div>
    ${S.aTot?`<div class="rrow" style="border-top:1px solid var(--line);padding-top:10px"><span>Urutan setelah salam</span><span></span><span class="muted">${S.aOk}/${S.aTot}</span></div>`:''}</div>
  <div class="row">${nextLv?`<button class="primary" id="up">Naik ke ${LEVELS[nextLv].name}</button>`:''}<button class="${nextLv?'ghost':'primary'}" id="again">Main lagi</button><button class="ghost" id="menu">Menu</button></div>`;
  const up=document.getElementById('up');if(up)up.onclick=()=>{S.level=nextLv;try{localStorage.setItem('level',nextLv)}catch(e){}start(S.mode)};
  document.getElementById('again').onclick=()=>start(S.mode);
  document.getElementById('menu').onclick=()=>{S.screen='home';render()};
}
render();
</script>

</body></html>
